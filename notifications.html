{% extends "base.html" %}{% block title %}Notifications{% endblock %}
{% block content %}<span class="eyebrow">UPDATES</span><h1 class="fw-bold mt-2 mb-4">Notifications</h1>{% if rows %}<div class="row g-3">{% for n in rows %}<div class="col-12"><div class="notification-card"><div class="notification-dot"></div><div><p class="mb-1">{{ n.message }}</p><span class="small text-secondary">{{ n.created_at|replace('T',' ') }}</span></div></div></div>{% endfor %}</div>{% else %}<div class="empty-state"><div class="empty-icon">🔔</div><h4>You're all caught up</h4><p>No notifications yet.</p></div>{% endif %}{% endblock %}
